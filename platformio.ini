; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-1230
lib_deps =
  arduino-libraries/Servo
build_src_filter =
  +<main.cpp>

; Follower 2 autonomous demo: a one-shot image derived from the F2 full
; calibration profile. It uses F2's own values and its separate power-on state
; machine; do not use this target for the interactive F2 controller.
[env:nanoatmega328_follower2_demo_g1]
extends = env:nanoatmega328
build_flags =
  -DFOLLOWER2_AUTORUN_G1
build_src_filter =
  +<follower2_demo_g1.cpp>
