; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-1230
lib_deps =
  arduino-libraries/Servo
build_src_filter =
  +<main.cpp>

; F2 is a one-shot, no-serial-control test image. It includes the verified F1
; control core but selects a separate source wrapper and compiles its autonomous
; power-on state machine. Do not make this the default F1 environment.
[env:nanoatmega328_f2_autorun_g1]
extends = env:nanoatmega328
build_flags =
  -DF2_AUTORUN_G1
build_src_filter =
  +<f2_autorun_g1.cpp>
