; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-1230
lib_deps =
  arduino-libraries/Servo
build_src_filter =
  +<main.cpp>

; Every vehicle uses the same one-shot demo targets. The selected branch's
; vehicle_profile.h supplies its calibrated parameters and path approval.
[env:nanoatmega328_demo_g1]
extends = env:nanoatmega328
build_flags =
  -DAUTORUN_PRESET_DEMO
  -DAUTORUN_PRESET_PATH=1
build_src_filter =
  +<demo_autorun.cpp>

; Standard autonomous demonstration: 700 mm square (G2). A vehicle profile
; that has not approved G2 will calibrate then remain stopped.
[env:nanoatmega328_demo_square]
extends = env:nanoatmega328
build_flags =
  -DAUTORUN_PRESET_DEMO
  -DAUTORUN_PRESET_PATH=2
build_src_filter =
  +<demo_autorun.cpp>
